steps:
  - label: ":jest: Jest (Test Scheduler pool)"
    parallelism: 2
    env:
      BUILDKITE_TEST_ENGINE_POOL_ID: "$BUILDKITE_TEST_ENGINE_POOL_ID"
      BUILDKITE_TEST_ENGINE_POOL_FALLBACK: "$BUILDKITE_TEST_ENGINE_POOL_FALLBACK"
      BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest
    commands:
      - cd jest
      - npm install
      - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
      - bktest pool run
    plugins:
      - tests#v1.3.0:
          test-runner: jest
          result-path: jest-result.json
          suite-slug: "$BUILDKITE_TEST_ENGINE_SUITE_SLUG"
          upload-results: false
          client-version: "$BKTEST_VERSION"
      - mise#v1.1.6:
          dir: jest
