steps:
  - label: ":pytest: pytest (Test Scheduler pool, persistent runner)"
    parallelism: 2
    env:
      BUILDKITE_TEST_ENGINE_POOL_ID: "$BUILDKITE_TEST_ENGINE_POOL_ID"
      BUILDKITE_TEST_ENGINE_POOL_FALLBACK: "$BUILDKITE_TEST_ENGINE_POOL_FALLBACK"
      # Keep runner logs streaming even without a TTY.
      PYTHONUNBUFFERED: "1"
    commands:
      - cd pytest
      - pip install -e '.[dev]'
      - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
      - bktest pool run -- buildkite-pytest
    plugins:
      - tests#v1.3.0:
          test-runner: pytest
          suite-slug: "$BUILDKITE_TEST_ENGINE_SUITE_SLUG"
          upload-results: false
          client-version: "$BKTEST_VERSION"
      - mise#v1.1.6:
          dir: pytest
