steps:
  - label: ":pytest: pytest (Test Scheduler pool)"
    parallelism: 2
    env:
      BUILDKITE_TEST_ENGINE_POOL_ID: "$BUILDKITE_TEST_ENGINE_POOL_ID"
      BUILDKITE_TEST_ENGINE_POOL_FALLBACK: "$BUILDKITE_TEST_ENGINE_POOL_FALLBACK"
    commands:
      - cd pytest
      - python -m venv .venv
      - . .venv/bin/activate
      - python -m pip install -e '.[dev]'
      - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
      - bktest pool run
    plugins:
      - tests#v1.3.0:
          test-runner: pytest
          test-file-pattern: "tests/**/test_*.py"
          suite-slug: "$BUILDKITE_TEST_ENGINE_SUITE_SLUG"
          upload-results: false
          client-version: "${BKTEST_VERSION:-3.7.0}"
      - mise#v1.1.6:
          dir: pytest
