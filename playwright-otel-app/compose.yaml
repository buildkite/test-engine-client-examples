services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: projects
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U example -d projects"]
      interval: 1s
      timeout: 5s
      retries: 30
