steps:
  - label: ":playwright: Playwright (Test Scheduler pool)"
    parallelism: 2
    env:
      BUILDKITE_TEST_ENGINE_POOL_ID: "$BUILDKITE_TEST_ENGINE_POOL_ID"
      BUILDKITE_TEST_ENGINE_POOL_FALLBACK: "$BUILDKITE_TEST_ENGINE_POOL_FALLBACK"
      BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright
    commands:
      - source .buildkite/use-built-bktest
      - cd playwright
      - npm ci
      - npx playwright install --with-deps chromium
      - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
      - bktest pool run
    plugins:
      - tests#v1.3.0:
          test-runner: playwright
          test-file-pattern: "tests/**/*.spec.js"
          result-path: tmp/playwright-results.json
          suite-slug: "$BUILDKITE_TEST_ENGINE_SUITE_SLUG"
          upload-results: false
          install-client: false
      - mise#v1.1.6:
          dir: playwright
