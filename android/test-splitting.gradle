import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.junitplatform.JUnitPlatformOptions

def testTaskName = providers.gradleProperty('splitTestTask').getOrElse('testDebugUnitTest')
def discovering = providers.gradleProperty('discoverTests').isPresent()
def assignedClasses = providers.gradleProperty('testClasses')
def combinedSelectors = layout.buildDirectory.file('test-selectors/all.txt').get().asFile
def selectedTasks = allprojects.collect { p -> p.tasks.withType(Test).matching { it.name == testTaskName } }

def assignments = []
if (!discovering && assignedClasses.isPresent()) {
    assignments = assignedClasses.get().tokenize()
    if (assignments.empty) throw new GradleException('testClasses must contain at least one class')
    if (!combinedSelectors.exists()) throw new GradleException('Run splitTests -PdiscoverTests before assigning classes')
    def unknown = assignments - combinedSelectors.readLines()
    if (!unknown.empty) throw new GradleException("Undiscovered test classes: ${unknown}")
}

tasks.register('splitTests') {
    dependsOn(selectedTasks)
    if (discovering) {
        doLast {
            def owners = new TreeMap<String, String>()
            selectedTasks.each { tasks -> tasks.each { task ->
                def manifest = task.project.layout.buildDirectory.file("test-selectors/${task.name}.txt").get().asFile
                if (task.state.skipped) {
                    // Skipped tasks must not transfer stale ownership.
                    manifest.delete()
                } else {
                    if (!manifest.exists()) throw new GradleException("Discovery task ${task.path} ran but did not write its selector manifest")
                    manifest.readLines().findAll().each { selector ->
                        def previous = owners.put(selector, task.path)
                        if (previous != null) {
                            throw new GradleException("Duplicate selector '${selector}' in ${previous} and ${task.path}; class names must be unique across selected modules")
                        }
                    }
                }
            } }
            combinedSelectors.parentFile.mkdirs()
            combinedSelectors.text = owners.keySet().join('\n') + '\n'
            logger.lifecycle("Discovered ${owners.size()} selectors across modules: ${owners}")
        }
    } else if (assignedClasses.isPresent()) {
        doLast {
            def assignmentCounts = [:].withDefault { 0 }
            selectedTasks.each { tasks -> tasks.each { task ->
                def manifest = task.project.layout.buildDirectory.file("test-selectors/${task.name}.txt").get().asFile
                def owned = manifest.exists() ? manifest.readLines() : []
                def classes = assignments.findAll { it in owned }
                if (!classes.empty && task.state.skipped) {
                    throw new GradleException("Assigned test task ${task.path} was skipped: ${classes}")
                }
                classes.each { assignmentCounts[it]++ }
            } }
            def invalid = assignments.findAll { assignmentCounts[it] != 1 }
            if (!invalid.empty) {
                throw new GradleException("Assigned classes must have exactly one owning Test task; check transferred selector manifests and splitTestTask: ${invalid}")
            }
        }
    }
}

allprojects {
    tasks.withType(Test).matching { it.name == testTaskName }.configureEach {
        def selectors = project.layout.buildDirectory.file("test-selectors/${name}.txt").get().asFile
        if (discovering || assignedClasses.isPresent()) {
            // Rerun tests without forcing compilation dependencies to rebuild.
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
        }
        if (discovering) {
            dryRun.set(true)
            // Dry-run XML must not be mistaken for real executions.
            reports.junitXml.required.set(false)
            reports.html.required.set(false)
            def classes = new TreeSet<String>()
            doFirst {
                reports.junitXml.outputLocation.get().asFile.deleteDir()
                selectors.parentFile.mkdirs()
                // Only the completed discovery listener may create the manifest.
                selectors.delete()
            }
            // Use the same outermost class/suite as the collector's timing tag.
            def discover = { descriptor ->
                def selector = null
                for (def current = descriptor; current != null; current = current.parent) {
                    if (current.className != null) selector = current.className
                }
                if (selector != null) {
                    if (selector =~ /[\s'*]/) {
                        throw new GradleException("Cannot split selector '${selector}': class names must not contain whitespace, apostrophes or '*' (a Gradle test-filter wildcard)")
                    }
                    classes.add(selector)
                }
            }
            // Atomic callbacks omit empty JUnit 4 suites and Enclosed placeholders.
            beforeTest { descriptor -> discover(descriptor) }
            beforeSuite { descriptor ->
                // Platform templates/factories have no atomic dry-run callbacks.
                if (options instanceof JUnitPlatformOptions && descriptor.className != null &&
                    descriptor.parent?.className == descriptor.className && descriptor.name != descriptor.className) {
                    discover(descriptor)
                }
            }
            afterSuite { descriptor, result ->
                if (descriptor.parent == null) {
                    selectors.text = classes.join('\n') + '\n'
                    logger.lifecycle("Discovered test classes for ${path}: ${classes.join(' ')}")
                }
            }
        } else if (assignedClasses.isPresent()) {
            def owned = selectors.exists() ? selectors.readLines() : []
            def classes = assignments.findAll { it in owned }
            onlyIf("this module owns assigned classes") { !classes.empty }
            doFirst {
                setTestNameIncludePatterns(classes)
                logger.lifecycle("Assigned test classes for ${path}: ${classes.join(' ')}")
            }
        }
        testLogging { events 'passed', 'failed', 'skipped' }
    }
}
