env:
  SWIFT_COLLECTOR_SHA: "8c48305e99deb2a30a7cd409439fa240be14658a"
  BKTEC_SHA: "f7f59d8e8135deff250eb374cd9906e0cd75c3db"

steps:
  - label: ":golang: Build PR relay for Darwin"
    key: relay-build
    agents:
      queue: hosted
    commands:
      - git clone https://github.com/buildkite/test-engine-client /tmp/relay-source
      - git -C /tmp/relay-source checkout "$$BKTEC_SHA"
      - mkdir -p bin
      - cd /tmp/relay-source
      - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$BUILDKITE_BUILD_CHECKOUT_PATH/bin/bktec-darwin-arm64" .
      - git rev-parse HEAD > "$BUILDKITE_BUILD_CHECKOUT_PATH/bin/bktec-source.txt"
    artifact_paths: "bin/*"
    plugins:
      - docker#v5.11.0:
          image: "golang:1.27.3"
          propagate-environment: true
          volumes:
            - "$BUILDKITE_BUILD_CHECKOUT_PATH:$BUILDKITE_BUILD_CHECKOUT_PATH"

  - label: ":swift: Direct runner restart %n"
    parallelism: 2
    agents:
      queue: macos
    commands:
      - bash swift-xcuitest/bin/install-pr-collector
      - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-direct-$$BUILDKITE_PARALLEL_JOB"
      - swift-xcuitest/bin/test
    artifact_paths:
      - "swift-xcuitest/artifacts/SwiftXCUITest.xcresult/**/*"
      - "swift-xcuitest/artifacts/*.log"
      - "swift-xcuitest/artifacts/Package.resolved"
      - "swift-xcuitest/artifacts/*.txt"
      - "swift-xcuitest/artifacts/*.tar.gz"
    env:
      BUILDKITE_ANALYTICS_DEBUG_ENABLED: "true"
      BUILDKITE_ANALYTICS_OTLP_ENDPOINT: "https://tests-otlp.buildkite.com/v1/traces"
    plugins:
      - tests#v1.0.1:
          test-runner: custom
          suite-slug: test-engine-client-examples
          upload-results: false
          install-client: false

  - label: ":swift: Relay runner restart %n"
    depends_on: relay-build
    parallelism: 2
    agents:
      queue: macos
    commands:
      - bash swift-xcuitest/bin/install-pr-collector
      - buildkite-agent artifact download "bin/*" . --step relay-build
      - chmod +x bin/bktec-darwin-arm64
      - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-relay-$$BUILDKITE_PARALLEL_JOB"
      - bin/bktec-darwin-arm64 run
    artifact_paths:
      - "swift-xcuitest/artifacts/SwiftXCUITest.xcresult/**/*"
      - "swift-xcuitest/artifacts/*.log"
      - "swift-xcuitest/artifacts/Package.resolved"
      - "swift-xcuitest/artifacts/*.txt"
      - "swift-xcuitest/artifacts/*.tar.gz"
    env:
      BUILDKITE_ANALYTICS_DEBUG_ENABLED: "true"
      BUILDKITE_TESTS_OTLP_RELAY: "true"
    plugins:
      - tests#v1.0.1:
          test-runner: custom
          test-cmd: swift-xcuitest/bin/test
          test-file-pattern: swift-xcuitest/ExampleAppUITests/**/*.swift
          suite-slug: test-engine-client-examples
          upload-results: false
          install-client: false
