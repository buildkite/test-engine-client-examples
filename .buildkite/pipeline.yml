steps:
  - label: "TE-7833: legacy plan"
    if: build.env("RECEIVER_MODE") != null
    agents:
      queue: hosted
    command: "cd rspec-otel/plan-gate-harness && bundle install && bundle exec ruby run.rb legacy"
    artifact_paths: "rspec-otel/plan-gate-harness/artifacts/*"
    plugins:
      - mise#v1.1.4:
          dir: rspec-otel/plan-gate-harness

  - label: "TE-7833: entitled control"
    if: build.env("RECEIVER_MODE") != null
    agents:
      queue: hosted
    command: "cd rspec-otel/plan-gate-harness && bundle install && bundle exec ruby run.rb entitled"
    artifact_paths: "rspec-otel/plan-gate-harness/artifacts/*"
    plugins:
      - mise#v1.1.4:
          dir: rspec-otel/plan-gate-harness

  - label: "TE-7833: legacy without stream header"
    if: build.env("RECEIVER_MODE") != null
    agents:
      queue: hosted
    command: "cd rspec-otel/plan-gate-harness && bundle install && bundle exec ruby run.rb unlabelled"
    artifact_paths: "rspec-otel/plan-gate-harness/artifacts/*"
    plugins:
      - mise#v1.1.4:
          dir: rspec-otel/plan-gate-harness
