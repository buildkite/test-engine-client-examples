# Temporary verification branch only; the customer example stays small.
steps:
  - label: ":pipeline: Swift verification matrix"
    agents:
      queue: hosted
    command: |
      mkdir -p .amp/in/orb-backup
      python3 -c "import os,base64,gzip;open('.amp/in/orb-backup/swift-proof.py','wb').write(gzip.decompress(base64.b64decode(os.environ['SWIFT_PROOF_SCRIPT'])))"
      python3 .amp/in/orb-backup/swift-proof.py pipeline > .amp/in/orb-backup/proof-pipeline.json
      buildkite-agent pipeline upload --no-interpolation .amp/in/orb-backup/proof-pipeline.json
