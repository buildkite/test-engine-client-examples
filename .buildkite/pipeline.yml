# Manual production validation only. Do not merge this pipeline replacement.
env:
  BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"

steps:
  - &ui
    label: ":swift: Arlo entitled restart"
    key: restart
    agents:
      queue: swift-macos-15-xcode-26-2
    command: bash swift-xcuitest/bin/production-check
    timeout_in_minutes: 30
    artifact_paths:
      - "swift-xcuitest/artifacts/**/*.json"
      - "swift-xcuitest/artifacts/**/*.log"
      - "swift-xcuitest/artifacts/**/*.txt"
      - "swift-xcuitest/artifacts/**/*.pb"
      - "swift-xcuitest/artifacts/**/Package.resolved"
      - "swift-xcuitest/artifacts/**/*.xcresult/**/*"
      - "swift-xctest/artifacts/Package.resolved"
      - "swift-xctest/artifacts/*.log"
    env:
      ARLO_SCENARIO: restart
      BUILDKITE_TESTS_OTLP_RELAY: "true"
    plugins:
      - tests#v1.0.1:
          test-runner: custom
          test-cmd: bash swift-xcuitest/bin/test
          test-file-pattern: swift-xcuitest/ExampleAppUITests/**/*.swift
          suite-slug: test-engine-client-examples
          upload-results: false
          client-version: "3.5.0"

  - <<: *ui
    label: ":swift: Arlo parallel clones"
    key: parallel
    env:
      ARLO_SCENARIO: parallel
      BUILDKITE_TESTS_OTLP_RELAY: "true"

  - <<: *ui
    label: ":swift: Arlo 1000 fast tests"
    key: fast
    env:
      ARLO_SCENARIO: fast
      BUILDKITE_TESTS_OTLP_RELAY: "true"
    plugins:
      - tests#v1.0.1:
          test-runner: custom
          test-cmd: swift test --package-path swift-xctest/artifacts/merge-suite --skip-build --disable-swift-testing
          test-file-pattern: swift-xctest/artifacts/merge-suite/Tests/**/*.swift
          suite-slug: test-engine-client-examples
          upload-results: false
          client-version: "3.5.0"

  - <<: *ui
    label: ":swift: Arlo direct refusal (stub, not prod)"
    key: stub
    env:
      ARLO_SCENARIO: stub
      BUILDKITE_TESTS_OTLP_RELAY: "false"
    plugins: []
