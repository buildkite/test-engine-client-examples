# To run every example on another bktest release, such as a release candidate,
# set BKTEST_VERSION on a new build. The pool examples require 3.7.0 or later.
env:
  BKTEST_VERSION: &bktest_version "${BKTEST_VERSION:-3.7.0}"

common:
  # This pipeline and its suite have the same slug before and after the rename.
  - &examples_suite "${BUILDKITE_PIPELINE_SLUG}"

steps:
  - group: ":ruby: Ruby"
    steps:
      - label: ":rspec: RSpec"
        parallelism: 2
        commands:
          - cd rspec
          - bundle install
          - bktest run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        plugins:
          - tests#v1.3.0:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: rspec

      # Plan once, then upload the workers with the pool ID and fallback flag.
      # The small lease cap demonstrates multiple leases on these tiny suites.
      - label: ":rspec: Plan RSpec pool"
        commands:
          - cd rspec
          # Planning can load the specs to discover individual examples.
          - bundle install
          # Scheduler requests need job identity claims that the plugin's token lacks.
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktest pool plan --pool-lease-max-attempts 2 --pipeline-upload pool-workers.yml
        plugins:
          - tests#v1.3.0:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: rspec

      - label: ":rspec: RSpec (OpenTelemetry setup by test collector)"
        commands:
          - cd rspec-otel
          - bundle install
          - bktest run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        plugins:
          - tests#v1.3.0:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: rspec-otel

      - label: ":ruby: Minitest"
        parallelism: 2
        commands:
          - cd ruby-minitest
          - bundle install
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: "bundle exec rake test TEST_FILES='{{testExamples}}'"
              test-file-pattern: "**/*_test.rb"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: ruby-minitest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: ruby-minitest

      - label: ":cucumber: Cucumber"
        parallelism: 2
        commands:
          - cd cucumber
          - bundle install
          - mkdir -p tmp
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: cucumber
              result-path: tmp/cucumber.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: cucumber
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: cucumber

  - group: ":javascript: JavaScript"
    steps:
      - label: ":mocha: Mocha"
        key: mocha
        parallelism: 2
        commands:
          - cd mocha
          - npm ci
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: "npx mocha {{testExamples}} --reporter mocha-multi-reporters --reporter-options configFile=reporter-config.json"
              test-file-pattern: "src/**/*.test.js"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: mocha
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: mocha

      - label: ":vitest: Vitest 4"
        key: vitest-4
        commands:
          - cd vitest-4
          - npm ci
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: vitest
              # CLI --reporter replaces configured reporters; keep the collector.
              test-cmd: "npx vitest run {{testExamples}} --outputFile {{resultPath}}"
              retry-cmd: "npx vitest run {{testExamples}} --testNamePattern '{{testNamePattern}}' --outputFile {{resultPath}}"
              result-path: tmp/vitest-results.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: vitest-4
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: vitest-4

      - label: ":vitest: Vitest"
        key: vitest
        commands:
          - cd vitest
          - npm ci
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: vitest
              # CLI --reporter replaces configured reporters; keep the collector.
              test-cmd: "npx vitest run {{testExamples}} --outputFile {{resultPath}}"
              retry-cmd: "npx vitest run {{testExamples}} --testNamePattern '{{testNamePattern}}' --outputFile {{resultPath}}"
              result-path: tmp/vitest-results.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: vitest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: vitest

      - label: ":vitest: Vitest (OpenTelemetry)"
        key: vitest-otel-relay
        commands:
          - cd vitest-otel
          - npm ci
          # Let the OTLP relay supply its own local authentication token.
          - unset BUILDKITE_TESTS_OTLP_TOKEN
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-vitest-otel-$$BUILDKITE_JOB_ID"
          - bktest run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: vitest-otel
        plugins:
          - tests#v1.3.0:
              test-runner: vitest
              # CLI --reporter replaces configured reporters; keep the collector.
              test-cmd: "npx vitest run {{testExamples}} --outputFile {{resultPath}}"
              retry-cmd: "npx vitest run {{testExamples}} --testNamePattern '{{testNamePattern}}' --outputFile {{resultPath}}"
              result-path: tmp/vitest-results.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: vitest-otel

      - label: ":jest: Jest"
        parallelism: 2
        commands:
          - cd jest
          - npm install
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: jest
              result-path: jest-result.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: jest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest
      - label: ":jest: Jest (Retry Enabled)"
        parallelism: 2
        commands:
          - cd jest
          - npm install
          - rm -f tmp/jest-retry-demo
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: jest
              result-path: jest-result.json
              retry-count: 3
              retry-cmd: "npx jest {{testExamples}} --testNamePattern '{{testNamePattern}}' --json --testLocationInResults --outputFile {{resultPath}}"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: jest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest
          JEST_RETRY_DEMO_MARKER: tmp/jest-retry-demo

      - label: ":jest: Jest (OTel setup by collector)"
        key: jest-otel-relay
        commands:
          - cd jest-otel
          - npm ci
          # Let the OTLP relay supply its own local authentication token.
          - unset BUILDKITE_TESTS_OTLP_TOKEN
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-jest-otel-$$BUILDKITE_JOB_ID"
          - bktest run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest-otel
        plugins:
          - tests#v1.3.0:
              test-runner: jest
              result-path: jest-result.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: jest-otel

      - label: ":jest: Plan Jest pool"
        commands:
          - cd jest
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktest pool plan --pool-lease-max-attempts 2 --pipeline-upload pool-workers.yml
        plugins:
          - tests#v1.3.0:
              test-runner: jest
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest

      - label: ":cypress: Cypress"
        parallelism: 2
        commands:
          - cd cypress
          - bin/setup
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: cypress
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: cypress

      - label: ":playwright: Playwright"
        parallelism: 2
        commands:
          - cd playwright
          - npm install
          - npx playwright install --with-deps chromium
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: playwright
              result-path: tmp/playwright-results.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: playwright
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright

      - label: ":playwright: Playwright (OpenTelemetry)"
        key: playwright-otel
        commands:
          - cd playwright-otel
          - npm ci
          - npx playwright install --with-deps chromium
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-playwright-otel-$$BUILDKITE_JOB_ID"
          # Let the OTLP relay supply its own local authentication token.
          - unset BUILDKITE_TESTS_OTLP_TOKEN
          - bktest run
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright-otel
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: "npm test -- {{testExamples}}"
              test-file-pattern: "tests/**/*.spec.js"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: playwright-otel

      - label: ":playwright: Plan Playwright pool"
        commands:
          - cd playwright
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktest pool plan --pool-lease-max-attempts 2 --pipeline-upload pool-workers.yml
        plugins:
          - tests#v1.3.0:
              test-runner: playwright
              test-file-pattern: "tests/**/*.spec.js"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright

  - group: ":python: Python"
    steps:
      - label: ":pytest: pytest"
        parallelism: 2
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest

      - label: ":pytest: pytest (with xdist)"
        parallelism: 2
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - bktest run
        env:
          PYTEST_XDIST_ENABLED: "true"
          PYTEST_ADDOPTS: "-n 3 -o log_cli=true -o log_cli_level=DEBUG"
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest

      - label: ":pytest: pytest (tag filters)"
        parallelism: 2
        commands:
          - cd pytest-tag-filters
          - pip install -e '.[dev]'
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              tag-filters: "component:frontend"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest-tag-filters

      - label: ":pytest: Plan pytest pool"
        commands:
          - cd pytest
          # Planning can collect individual tests from files flagged by Test Engine.
          - pip install -e '.[dev]'
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktest pool plan --pool-lease-max-attempts 2 --pipeline-upload pool-workers.yml
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest

      - label: ":pytest: Plan persistent pytest pool"
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktest pool plan --pool-lease-max-attempts 2 --pipeline-upload pool-workers-persistent.yml
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest

      - label: ":pytest: pytest (OTel setup by collector)"
        key: pytest-otel-relay
        commands:
          - cd pytest-otel
          - pip install -r requirements.txt
          - mkdir -p tmp
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-python-otel-relay-$$BUILDKITE_JOB_ID"
          - bktest run
        artifact_paths: pytest-otel/tmp/otel-relay.json
        env:
          BUILDKITE_ANALYTICS_OTEL_ENABLED: "true"
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          PYTEST_ADDOPTS: "-n 3"
        plugins:
          - tests#v1.3.0:
              test-runner: pytest
              result-path: tmp/otel-relay.json
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: pytest-otel

  - group: ":apple: iOS / macOS"
    steps:
      - label: ":swift: Swift: XCTest (test-collector-swift)"
        commands:
          - cd swift-xctest
          - swift package resolve
          # Run XCTest tests (which includes the BuildkiteTestCollector).
          # The collector auto-loads via XCTest observation and uploads results
          # when BUILDKITE_ANALYTICS_TOKEN is set.
          # Use --disable-swift-testing to only run XCTest (not Swift Testing).
          - swift test --disable-swift-testing
        env:
          BUILDKITE_ANALYTICS_TAGS: '{"test.framework.name":"xctest","language.name":"swift","custom.tag.from":"upload"}'
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              suite-slug: *examples_suite
              upload-results: false
              install-client: false
          - docker#v5.14.0:
              image: "swift:6.0-noble"
              propagate-environment: true
              environment:
                - BUILDKITE_ANALYTICS_TOKEN
                - BUILDKITE_ANALYTICS_TAGS
                - BUILDKITE_ANALYTICS_DEBUG_ENABLED

      - label: ":swift: XCUITest build and discover"
        key: swift-xcuitest-build
        command: swift-xcuitest/bin/build
        agents:
          queue: swift-macos-15-xcode-26-2
        artifact_paths: swift-xcuitest/artifacts/tests.tar.gz

      - label: ":swift: XCUITest shard %n"
        key: swift-xcuitest-shards
        depends_on: swift-xcuitest-build
        parallelism: 2
        commands:
          - buildkite-agent artifact download swift-xcuitest/artifacts/tests.tar.gz . --step swift-xcuitest-build
          - tar -xzf swift-xcuitest/artifacts/tests.tar.gz -C swift-xcuitest/artifacts
          - bktest run --plan-out swift-xcuitest/artifacts/plan.json
        agents:
          queue: swift-macos-15-xcode-26-2
        artifact_paths:
          - swift-xcuitest/artifacts/results.xcresult/**/*
          - swift-xcuitest/artifacts/plan.json
        env:
          BUILDKITE_TEST_ENGINE_SELECTOR_FILE: swift-xcuitest/artifacts/selectors.txt
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: swift-xcuitest/bin/test {{testExamples}}
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version

  - group: ":android: Android"
    steps:
      - label: ":android: Discover JVM tests"
        key: android-discover
        commands:
          - cd android
          - ./gradlew --no-configuration-cache splitTests -PdiscoverTests
        artifact_paths:
          - android/**/build/test-selectors/*.txt
        plugins:
          - docker#v5.14.0:
              image: ghcr.io/cirruslabs/android-sdk:34
              user: "0:0"

      - label: ":android: Android"
        key: android
        depends_on: android-discover
        parallelism: 2
        commands:
          - buildkite-agent artifact download "android/*/test-selectors/*.txt" . --step android-discover
          - cd android
          - bktest run
        env:
          BUILDKITE_TEST_ENGINE_SELECTOR_FILE: build/test-selectors/all.txt
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: >-
                sh -c 'docker run --rm --user 0:0 --volume "$$PWD:/workdir" --workdir /workdir
                --env BUILDKITE_ANALYTICS_TOKEN --env BUILDKITE_BUILD_ID --env BUILDKITE_JOB_ID
                --env BUILDKITE_BUILD_NUMBER --env BUILDKITE_BUILD_URL --env BUILDKITE_BRANCH --env BUILDKITE_COMMIT
                ghcr.io/cirruslabs/android-sdk:34
                ./gradlew --no-configuration-cache --continue splitTests -PtestClasses="$$1"' sh '{{testExamples}}'
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version

  # Gradle runs on the agent, so --no-daemon keeps it from leaving daemons behind.
  - group: ":kotlin: Kotlin / Java"
    steps:
      - label: ":gradle: Discover Kotlin / Java tests"
        key: gradle-jvm-discover
        commands:
          - cd gradle-jvm
          # With a token, the collector would upload every discovered test as skipped.
          - unset BUILDKITE_ANALYTICS_TOKEN
          - ./gradlew --no-daemon --no-configuration-cache splitTests -PdiscoverTests
        artifact_paths:
          - gradle-jvm/**/build/test-selectors/*.txt
        plugins:
          - mise#v1.1.6:
              dir: gradle-jvm

      - label: ":gradle: Kotlin / Java"
        key: gradle-jvm
        depends_on: gradle-jvm-discover
        parallelism: 2
        commands:
          - buildkite-agent artifact download "gradle-jvm/*/test-selectors/*.txt" . --step gradle-jvm-discover
          - cd gradle-jvm
          - bktest run
        env:
          BUILDKITE_TEST_ENGINE_SELECTOR_FILE: build/test-selectors/all.txt
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: "./gradlew --no-daemon --no-configuration-cache --continue splitTests -PtestClasses='{{testExamples}}'"
              suite-slug: *examples_suite
              upload-results: false
              client-version: *bktest_version
          - mise#v1.1.6:
              dir: gradle-jvm

  - group: ":golang: Go"
    steps:
      - label: ":golang: Go test"
        parallelism: 2
        commands:
          - cd go
          - go install gotest.tools/gotestsum@v1.12.0
          - bktest run
        plugins:
          - tests#v1.3.0:
              test-runner: gotest
              result-path: tmp/gotest-result.jsonl
              suite-slug: *examples_suite
              client-version: *bktest_version
              tags:
                - "language.name=go"
                - "test.framework.name=go-test"
          - mise#v1.1.6:
              dir: go

  - group: ":rust: Rust"
    steps:
      - label: ":rust: Rust / nextest"
        key: rust-nextest
        parallelism: 2
        commands:
          - cd rust
          - mkdir -p target
          - bin/discover > target/selectors.txt
          - '"$$BUILDKITE_TEST_ENGINE_CLIENT_PATH" run --plan-out target/plan.json'
        artifact_paths:
          - rust/target/plan.json
          - rust/target/nextest/ci/buildkite.xml
        env:
          BUILDKITE_TEST_ENGINE_SELECTOR_FILE: target/selectors.txt
        plugins:
          - tests#v1.3.0:
              test-runner: custom
              test-cmd: "bin/test {{testExamples}}"
              result-path: target/nextest/ci/buildkite.xml
              suite-slug: *examples_suite
              client-version: *bktest_version
              tags:
                - "language.name=rust"
                - "test.framework.name=nextest"
          - mise#v1.1.6:
              dir: rust
