cache:
  paths:
    - "mise"

steps:
  - group: ":ruby: Ruby"
    steps:
      - label: ":rspec: RSpec"
        parallelism: 2
        commands:
          - cd rspec
          - bundle install
          - bktec run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: rspec

      # bktec pool exec runs one persistent buildkite-rspec process that leases
      # batches from a Test Scheduler pool shared by this step's jobs.
      # --pool-lease-max-attempts 2 caps attempts per lease so jobs cycle
      # through several leases from the pool instead of one big lease.
      # Unlike pool consume, pool exec does not inject an upload token, so the
      # BUILDKITE_ANALYTICS_TOKEN exported by the Tests plugin stays set for the
      # collector running inside the persistent runner.
      - label: ":rspec: RSpec (Test Scheduler pool exec)"
        parallelism: 2
        commands:
          - cd rspec
          - bundle install
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec pool exec --pool-lease-max-attempts 2 -- bundle exec buildkite-rspec
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.4.0"
          - mise#v1.1.4:
              dir: rspec

      - label: ":rspec: RSpec (OpenTelemetry setup in suite)"
        commands:
          - cd rspec-otel/suite-setup
          - bundle install
          - bktec run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        plugins:
          - tests#v1.0.1:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: rspec-otel/suite-setup

      - label: ":rspec: RSpec (OpenTelemetry setup by test collector)"
        commands:
          - cd rspec-otel/collector-setup
          - bundle install
          - bktec run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        plugins:
          - tests#v1.0.1:
              test-runner: rspec
              result-path: tmp/rspec.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: rspec-otel/collector-setup

      - label: ":ruby: Minitest"
        parallelism: 2
        commands:
          - cd ruby-minitest
          - bundle install
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: custom
              test-cmd: "bundle exec rake test TEST_FILES='{{testExamples}}'"
              test-file-pattern: "**/*_test.rb"
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: ruby-minitest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: ruby-minitest

      - label: ":cucumber: Cucumber"
        parallelism: 2
        commands:
          - cd cucumber
          - bundle install
          - mkdir -p tmp
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: cucumber
              result-path: tmp/cucumber.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: cucumber
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: cucumber

  # The tests plugin exports a short-lived token before setup. Unset it before
  # bktec so long dependency installs cannot leave it with stale credentials.
  - group: ":javascript: JavaScript"
    steps:
      - label: ":vitest: Vitest 4"
        key: vitest-4
        commands:
          - cd vitest-4
          - npm ci
          - npm test
        plugins:
          - tests#v1.0.0:
              test-runner: custom
              suite-slug: test-engine-client-examples
              upload-results: false
              install-client: false
          - mise#v1.1.4:
              dir: vitest-4
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: vitest-4

      - label: ":vitest: Vitest"
        key: vitest
        commands:
          - cd vitest
          - npm ci
          - npm test
        plugins:
          - tests#v1.0.0:
              test-runner: custom
              suite-slug: test-engine-client-examples
              upload-results: false
              install-client: false
          - mise#v1.1.4:
              dir: vitest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: vitest

      - label: ":jest: Jest"
        parallelism: 2
        commands:
          - cd jest
          - npm install
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: jest
              result-path: jest-result.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: jest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest
      - label: ":jest: Jest (Retry Enabled)"
        parallelism: 2
        commands:
          - cd jest
          - npm install
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: jest
              result-path: jest-result.json
              retry-count: 3
              retry-cmd: "npx jest {{testExamples}} --testNamePattern '{{testNamePattern}}' --json --testLocationInResults --outputFile {{resultPath}}"
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: jest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest

      - label: ":jest: Jest (OTel setup by collector)"
        key: jest-otel-relay
        commands:
          - cd jest-otel
          - npm ci
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN BUILDKITE_TESTS_OTLP_TOKEN
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-jest-otel-$$BUILDKITE_JOB_ID"
          - bktec run
        env:
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest-otel
        plugins:
          - tests#v1.0.1:
              test-runner: jest
              result-path: jest-result.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: jest-otel

      # bktec pool consume starts a fresh Jest process for each leased batch,
      # drawing from a Test Scheduler pool shared by this step's jobs.
      # --pool-lease-max-attempts 2 caps attempts per lease so jobs cycle
      # through several leases from the pool instead of one big lease.
      - label: ":jest: Jest (Test Scheduler pool)"
        parallelism: 2
        commands:
          - cd jest
          - npm install
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec pool consume --pool-lease-max-attempts 2
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: jest
              result-path: jest-result.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.4.0"
          - mise#v1.1.4:
              dir: jest
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: jest

      - label: ":cypress: Cypress"
        parallelism: 2
        commands:
          - cd cypress
          - bin/setup
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: cypress
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: cypress

      - label: ":playwright: Playwright"
        parallelism: 2
        commands:
          - cd playwright
          - npm install
          - npx playwright install --with-deps chromium
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: playwright
              result-path: tmp/playwright-results.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: playwright
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright

      - label: ":playwright: Playwright (OpenTelemetry)"
        key: playwright-otel
        commands:
          - cd playwright-otel
          - bin/setup
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-playwright-otel-$$BUILDKITE_JOB_ID"
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        soft_fail:
          - exit_status: 1
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright-otel
          BUILDKITE_TESTS_OTLP_RELAY: "true"
        plugins:
          - tests#v1.0.1:
              test-runner: custom
              test-cmd: "npm test -- {{testExamples}}"
              test-file-pattern: "tests/**/*.spec.js"
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: playwright-otel

      # bktec pool consume starts a fresh Playwright process for each leased
      # batch, drawing from a Test Scheduler pool shared by this step's jobs.
      # --pool-lease-max-attempts 2 caps attempts per lease so jobs cycle
      # through several leases from the pool instead of one big lease.
      - label: ":playwright: Playwright (Test Scheduler pool)"
        parallelism: 2
        commands:
          - cd playwright
          - npm install
          - npx playwright install --with-deps chromium
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec pool consume --pool-lease-max-attempts 2
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: playwright
              test-file-pattern: "tests/**/*.spec.js"
              result-path: tmp/playwright-results.json
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.4.0"
          - mise#v1.1.4:
              dir: playwright
        env:
          BUILDKITE_ANALYTICS_LOCATION_PREFIX: playwright

  - group: ":python: Python"
    steps:
      - label: ":pytest: pytest"
        parallelism: 2
        artifact_paths:
          - pytest/result.json
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: pytest
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: pytest

      - label: ":pytest: pytest (with xdist)"
        parallelism: 2
        artifact_paths:
          - pytest/result.json
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - bktec run
        soft_fail:
          - exit_status: 1
        env:
          PYTEST_XDIST_ENABLED: "true"
          PYTEST_ADDOPTS: "-n 3 -o log_cli=true -o log_cli_level=DEBUG"
        plugins:
          - tests#v1.0.0:
              test-runner: pytest
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: pytest

      - label: ":pytest: pytest (tag filters)"
        parallelism: 2
        artifact_paths:
          - pytest/result.json
        commands:
          - cd pytest-tag-filters
          - pip install -e '.[dev]'
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: pytest
              tag-filters: "component:frontend"
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: pytest-tag-filters

      # bktec pool consume starts a fresh pytest process for each leased batch,
      # drawing from a Test Scheduler pool shared by this step's jobs.
      # --pool-lease-max-attempts 2 caps attempts per lease so jobs cycle
      # through several leases from the pool instead of one big lease.
      - label: ":pytest: pytest (Test Scheduler pool)"
        parallelism: 2
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec pool consume --pool-lease-max-attempts 2
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: pytest
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.4.0"
          - mise#v1.1.4:
              dir: pytest

      # bktec pool exec runs one persistent buildkite-pytest process that
      # leases batches from a Test Scheduler pool shared by this step's jobs,
      # so pytest startup and session fixtures run once per job.
      # --pool-lease-max-attempts 2 caps attempts per lease so jobs cycle
      # through several leases from the pool instead of one big lease.
      - label: ":pytest: pytest (Test Scheduler pool exec)"
        parallelism: 2
        env:
          # Without a TTY, Python block-buffers the runner's stdout; keep it
          # streaming so a silent or hung runner is visible in the job log.
          PYTHONUNBUFFERED: "1"
        commands:
          - cd pytest
          - pip install -e '.[dev]'
          # 1.10.0b1 is the first release with the buildkite-pytest runner;
          # --force-reinstall replaces the older buildkite-test-collector
          # already installed by `pip install -e '.[dev]'`.
          - pip install --force-reinstall 'buildkite-test-collector==1.10.0b1'
          - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec pool exec --pool-lease-max-attempts 2 -- buildkite-pytest
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.1:
              test-runner: pytest
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.4.0"
          - mise#v1.1.4:
              dir: pytest

      - label: ":pytest: pytest (OTel setup by collector)"
        key: pytest-otel-relay
        commands:
          - cd pytest-otel/collector-setup
          - pip install -r requirements.txt
          - mkdir -p tmp
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-python-otel-relay-$$BUILDKITE_JOB_ID"
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        artifact_paths: pytest-otel/collector-setup/tmp/otel-relay.json
        soft_fail:
          - exit_status: 1
        env:
          BUILDKITE_ANALYTICS_OTEL_ENABLED: "true"
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          PYTEST_ADDOPTS: "-n 3"
        plugins:
          - tests#v1.0.0:
              test-runner: pytest
              result-path: tmp/otel-relay.json
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: pytest-otel/collector-setup

      - label: ":pytest: pytest (OTel setup in suite)"
        key: pytest-otel-suite-relay
        commands:
          - cd pytest-otel/suite-setup
          - pip install -r requirements.txt
          - mkdir -p tmp
          - export BUILDKITE_ANALYTICS_KEY="$$BUILDKITE_BUILD_ID-python-otel-suite-$$BUILDKITE_JOB_ID"
          - unset BUILDKITE_ANALYTICS_TOKEN BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
          - bktec run
        artifact_paths: pytest-otel/suite-setup/tmp/otel-relay.json
        soft_fail:
          - exit_status: 1
        env:
          BUILDKITE_ANALYTICS_OTEL_ENABLED: "true"
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          PYTEST_ADDOPTS: "-n 3"
        plugins:
          - tests#v1.0.0:
              test-runner: pytest
              result-path: tmp/otel-relay.json
              upload-results: false
              client-version: "3.5.0"
          - mise#v1.1.4:
              dir: pytest-otel/suite-setup

  - group: ":apple: iOS / macOS"
    steps:
      - label: ":swift: Swift: XCTest (test-collector-swift)"
        commands:
          - cd swift-xctest
          - swift package resolve
          # Run XCTest tests (which includes the BuildkiteTestCollector).
          # The collector auto-loads via XCTest observation and uploads results
          # when BUILDKITE_ANALYTICS_TOKEN is set.
          # Use --disable-swift-testing to only run XCTest (not Swift Testing).
          - swift test --disable-swift-testing
        soft_fail:
          - exit_status: 1
        env:
          BUILDKITE_ANALYTICS_TAGS: '{"test.framework.name":"xctest","language.name":"swift","custom.tag.from":"upload"}'
        plugins:
          - tests#v1.0.0:
              test-runner: custom
              suite-slug: test-engine-client-examples
              upload-results: false
              install-client: false
          - docker#v5.11.0:
              image: "swift:6.0-noble"
              propagate-environment: true
              environment:
                - BUILDKITE_ANALYTICS_TOKEN
                - BUILDKITE_ANALYTICS_TAGS
                - BUILDKITE_ANALYTICS_DEBUG_ENABLED

      - label: ":swift: Swift: XCUITest (test-collector-swift)"
        command: bktec run
        agents:
          queue: swift-macos-15-xcode-26-2
        artifact_paths:
          - swift-xcuitest/artifacts/SwiftXCUITest.xcresult/**/*
        env:
          BUILDKITE_ANALYTICS_TAGS: '{"test.framework.name":"xcuitest","language.name":"swift","custom.tag.from":"upload"}'
          # Hand each finished test to bktec, which outlives the XCTest runner,
          # and batch the relay's uploads to Test Engine.
          BUILDKITE_TESTS_OTLP_RELAY: "true"
          BUILDKITE_TESTS_OTLP_RELAY_BATCHING: "true"
        plugins:
          - tests#v1.1.0:
              test-runner: custom
              test-cmd: swift-xcuitest/bin/test
              test-file-pattern: swift-xcuitest/ExampleAppUITests/**/*.swift
              suite-slug: test-engine-client-examples
              upload-results: false
              client-version: "3.5.0"

  - group: ":android: Android"
    steps:
      - label: ":android: Android"
        commands:
          - cd android
          # Run Android unit tests
          # The test-collector-android Gradle plugin uploads results to Test Engine automatically.
          # No bktec client is needed for this example.
          - ./gradlew --no-daemon :app:testDebugUnitTest
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: custom
              suite-slug: test-engine-client-examples
              upload-results: false
              install-client: false
          - docker#v5.11.0:
              image: "ghcr.io/cirruslabs/android-sdk:34"
              propagate-environment: true
              environment:
                - BUILDKITE_ANALYTICS_TOKEN

  - group: ":golang: Go"
    steps:
      - label: ":golang: Go test"
        parallelism: 2
        commands:
          - cd go
          - go install gotest.tools/gotestsum@v1.12.0
          - bktec run
        soft_fail:
          - exit_status: 1
        plugins:
          - tests#v1.0.0:
              test-runner: gotest
              result-path: tmp/gotest-result.jsonl
              suite-slug: test-engine-client-examples
              client-version: "3.5.0"
              tags:
                - "language.name=go"
                - "test.framework.name=go-test"
          - mise#v1.1.4:
              dir: go
