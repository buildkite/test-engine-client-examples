steps:
  - label: ":jest: Exact v3.6.0 consumer and tagged installer"
    if: build.branch == "te-8021-stable-canary"
    timeout_in_minutes: 10
    env:
      TE8021_CONFIRMED_ARCHIVE_SHA256: e758f9e8d17b175a744c315c3f9daf281719f8f312e6baa84da51d5ee2feb0c8
    commands:
      - cd jest-otel
      - npm ci
      - bash ../.buildkite/stable-canary.sh hosted
    artifact_paths: jest-otel/stable-receipts/*
    plugins:
      - mise#v1.1.6:
          dir: jest-otel
