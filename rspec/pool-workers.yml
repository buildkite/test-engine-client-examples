steps:
  - label: ":rspec: RSpec (Test Scheduler pool)"
    parallelism: 2
    env:
      BUILDKITE_TEST_ENGINE_POOL_ID: "$BUILDKITE_TEST_ENGINE_POOL_ID"
      BUILDKITE_TEST_ENGINE_POOL_FALLBACK: "$BUILDKITE_TEST_ENGINE_POOL_FALLBACK"
    commands:
      - source .buildkite/use-built-bktest
      - cd rspec
      - bundle install
      # The persistent runner's collector still uses BUILDKITE_ANALYTICS_TOKEN.
      - unset BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN
      - bktest pool run -- bundle exec buildkite-rspec
    plugins:
      - tests#v1.3.0:
          test-runner: rspec
          suite-slug: "$BUILDKITE_TEST_ENGINE_SUITE_SLUG"
          upload-results: false
          install-client: false
      - mise#v1.1.6:
          dir: rspec
